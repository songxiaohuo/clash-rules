[Proxy Group]
# 自动延迟测试组，增加 tolerance 减少频繁切换造成的网络抖动
PROXY = select, 美国-自动,日本-自动,新加坡-自动,香港-自动, 所有-手动
香港-自动 = url-test, Nex, Flower, use=true, interval=3600, tolerance=50, timeout=3, url=http://cp.cloudflare.com/generate_204, policy-regex-filter=(?i)香港|HK|Hong Kong|🇭🇰
台湾-自动 = url-test, Nex, Flower, use=true, interval=3600, tolerance=50, timeout=3, url=http://cp.cloudflare.com/generate_204, policy-regex-filter=(?i)台湾|台灣|TW|Taiwan|🇹🇼
美国-自动 = url-test, Nex, Flower, use=true, interval=3600, tolerance=50, timeout=3, url=http://cp.cloudflare.com/generate_204, policy-regex-filter=美国|美國|US|United States|USA|🇺🇸
日本-自动 = url-test, Nex, Flower, use=true, interval=3600, tolerance=50, timeout=3, url=http://cp.cloudflare.com/generate_204, policy-regex-filter=(?i)日本|JP|Japan|🇯🇵
英国-自动 = url-test, Nex, Flower, use=true, interval=3600, tolerance=50, timeout=3, url=http://cp.cloudflare.com/generate_204, policy-regex-filter=(?i)英国|英國|UK|United Kingdom|GB|🇬🇧|UNITED KINGDOM
新加坡-自动 = url-test, Nex, Flower, use=true, interval=3600, tolerance=50, timeout=3, url=http://cp.cloudflare.com/generate_204, policy-regex-filter=(?i)新加坡|SG|Singapore|🇸🇬
所有-手动 = select, Nex, Flower, use=true



